[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-rag"
version = "0.1.0"
description = "Multi-agent quantum computing research assistant"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115,<1",
	"langgraph>=0.2,<1",
	"langchain>=0.3,<1",
	"faiss-cpu>=1.8,<2",
	"sentence-transformers>=3.1,<4",
	"qiskit>=1.2,<2",
	"qiskit-machine-learning>=0.8,<1",
	"sqlalchemy[asyncio]>=2,<3",
	"neo4j>=5,<6",
	"redis>=5,<6",
	"streamlit>=1.38,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
